name: FIME-ML CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-notebooks-and-code:
    name: Validate Notebooks JSON, Python Syntax & Lint
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lightweight validation tools inside container
        run: |
          pip install --no-cache-dir nbformat ruff

      - name: Validate Jupyter Notebooks schema and extract code cells
        run: |
          python3 - <<'EOF'
          import nbformat, pathlib
          for rel in ["AF3/AF3.ipynb", "PIA/PIA_CNN_Piedra_Papel_Tijera.ipynb"]:
              nb_path = pathlib.Path(rel)
              nb = nbformat.read(nb_path, as_version=4)
              nbformat.validate(nb)
              code_cells = [c for c in nb.cells if c.cell_type == "code"]
              for idx, cell in enumerate(code_cells, start=1):
                  compile(cell.source, f"{nb_path}:cell_{idx}", "exec")
              print(f"Validated {nb_path}: {len(nb.cells)} cells ({len(code_cells)} code cells compiled cleanly).")
          EOF

      - name: Lint Python helper scripts with ruff
        run: |
          ruff check AF3/scripts/ PIA/scripts/

  build-latex-reports:
    name: Compile AF3 and PIA LaTeX Reports to PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile AF3 LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: AF3/report
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Compile PIA LaTeX report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: PIA/report
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Upload compiled PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FIME-ML-Reports-PDF
          path: |
            AF3/report/main.pdf
            PIA/report/main.pdf
